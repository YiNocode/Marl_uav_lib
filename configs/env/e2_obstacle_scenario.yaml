# E2 obstacle-rich 3v1 scenario defaults (task layer).
#
# Shared by PyFlyt / Genesis E2 env configs via ``scenario_config`` so obstacle
# layout parameters live in one place instead of each experiment YAML.

task_defaults:
  name: pursuit_evasion_3v1_ex2
  world_xy: 20.0
  z_min: 0.5
  z_max: 5.0
  capture_dist: 1.0
  episode_limit: 1000
  # Grid layout: top-left (-world_xy, +world_xy), +x then -y every spacing metres.
  # world_xy=20, spacing=4 → 11×11=121 cylinders; num_obstacles_* auto-synced in task.
  obstacle_grid_spacing: 8.0
  obstacle_radius_min_ratio: 0.012
  obstacle_radius_max_ratio: 0.045
  obstacle_min_gap_xy_ratio: 0.02
  arena_edge_margin_ratio: 0.08
  pursuer_obstacle_hit_radius_ratio: 0.015
  init_clearance_extra_ratio: 0.02
  obstacle_collision_penalty: 15.0
  max_obstacle_place_trials: 8000
