# PyFlyt 3v1 pursuit-evasion backend config.
#
# The experiment YAML selects the task variant through task.name:
#   pursuit_evasion_3v1 / pursuit_evasion_3v1_ex1 / pursuit_evasion_3v1_ex2
#
# For E2 obstacle-rich PyFlyt runs, prefer configs/env/e2_pyflyt_3v1_obstacles.yaml.
# Dream-MAPPO uses continuous actions. The policy outputs final environment
# actions in the same scale as action_low/action_high; the task maps those
# actions to [vx, vy, yaw_rate, vz] setpoints.

env_id: pyflyt_navigation
action_space: continuous
action_dim: 4
# Four continuous control dimensions: [vx, vy, yaw_rate, vz].
action_low: [-0.25, -0.25, -0.01, -0.15]
action_high: [0.25, 0.25, 0.01, 0.15]

backend:
  num_agents: 4
  drone_type: quadx
  # Keep render disabled for training throughput and server runs.
  render: False
  physics_hz: 240
  control_hz: 60
  world_scale: 5.0
  flight_mode: 6
  seed_offset: 0
  drone_options: {}
