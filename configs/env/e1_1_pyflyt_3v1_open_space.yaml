# E1.1 open-space PyFlyt 3v1 backend config.
#
# Kept separate from configs/env/pyflyt_3v1.yaml so the main benchmark can
# evolve independently from earlier experiments.

env_id: pyflyt_navigation
action_space: continuous
action_dim: 4
# Policy/command box (not m/s). Task maps action/ref * pursuer_speed_xy → setpoint.
# Keep task.continuous_action_xy_ref == action_high[0] for full-speed commands.
action_low: [-0.25, -0.25, -0.01, -0.15]
action_high: [0.25, 0.25, 0.01, 0.15]

backend:
  num_agents: 4
  drone_type: quadx
  render: False
  physics_hz: 240
  control_hz: 60
  world_scale: 5.0
  flight_mode: 6
  seed_offset: 0
  drone_options: {}

