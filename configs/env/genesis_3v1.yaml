# Genesis 3v1 pursuit-evasion backend config.
#
# This config intentionally keeps the high-level action space equal to
# configs/env/pyflyt_3v1.yaml. The task still outputs velocity setpoints
# [vx, vy, yaw_rate, vz]; GenesisBackend sends pos + [vx, vy, vz] * dt to set_pos.

env_id: genesis_pursuit_3v1
backend: genesis
action_space: continuous
action_dim: 4
# High-level task action: [vx, vy, yaw_rate, vz].
action_low: [-0.25, -0.25, -0.01, -0.15]
action_high: [0.25, 0.25, 0.01, 0.15]

backend_config:
  # Set headless: true for server training. Use false only for local visual debug.
  headless: true
  # eval.py --render overrides headless and uses run_in_thread: false on Windows
  # to avoid PyGlet viewer thread errors. Genesis records videos to
  # ~/.cache/genesis when pressing r in the interactive viewer; the backend
  # creates that folder automatically before scene creation.
  viewer_options:
    run_in_thread: false
  # Genesis init backend: gpu or cpu. Genesis is imported only when this backend is requested.
  device: gpu
  dt: 0.01
  gravity: [0.0, 0.0, -9.81]
  # scripts/train.py overrides this with train.num_envs for native Genesis parallel training.
  # Keep this at 1 for single-env smoke tests and evaluation.
  n_envs: 1
  # DroneEntity model from Genesis docs.
  drone_model: CF2X
  drone_urdf: urdf/drones/cf2x.urdf
  # velocity: task setpoints [vx, vy, yaw_rate, vz] -> set_pos(pos + [vx, vy, vz] * dt).
  action_type: velocity
  low_level_control: set_pos
  num_pursuers: 3
  num_evaders: 1
