# E2 obstacle-rich PyFlyt 3v1 env for non-RL geometric/heuristic controllers.
#
# RL methods use configs/env/e2_pyflyt_3v1_obstacles.yaml (tighter yaw box).
# Heuristic controllers use wider yaw_rate bounds plus task.pursuer_vertical_speed.

scenario_config: configs/env/e2_obstacle_scenario.yaml

env_id: pyflyt_navigation
action_space: continuous
action_dim: 4
# [vx, vy, yaw_rate, vz] command box (not m/s). Match task continuous_action_*_ref fields.
action_low: [-0.25, -0.25, -0.25, -0.15]
action_high: [0.25, 0.25, 0.25, 0.15]

backend:
  num_agents: 4
  drone_type: quadx
  render: False
  physics_hz: 240
  control_hz: 60
  world_scale: 5.0
  flight_mode: 6
  seed_offset: 0
  drone_options: {}
