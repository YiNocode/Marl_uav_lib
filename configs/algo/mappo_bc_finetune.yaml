# MAPPO hyperparameters for BC warm-start fine-tuning (mappo_bc only).
# Plain ex1 MAPPO keeps configs/algo/mappo.yaml.

algo: mappo

action_space: continuous

gamma: 0.99
gae_lambda: 0.95

clip_ratio: 0.1

value_coef: 0.5
entropy_coef: 0.0

lr: 1e-5
epochs: 1
minibatch_size: 8192
max_grad_norm: 0.5
target_kl: 0.02

use_centralized_critic: true
