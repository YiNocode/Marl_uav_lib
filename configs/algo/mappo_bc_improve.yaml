# Slightly higher LR for improvement-phase MAPPO (mappo_bc_improve only).

algo: mappo

action_space: continuous

gamma: 0.99
gae_lambda: 0.95

clip_ratio: 0.15

value_coef: 0.5
entropy_coef: 0.0

lr: 3e-5
epochs: 1
minibatch_size: 8192
max_grad_norm: 0.5
target_kl: 0.03

use_centralized_critic: true
