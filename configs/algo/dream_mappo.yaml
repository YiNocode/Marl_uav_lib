# Execution-backend hyperparameters for the SCE framework (legacy key: dream_mappo).
#
# framework: structure_preserving_encirclement
# execution_backend: mappo  (standard centralized-critic PPO/MAPPO learner — not modified)
# policy_head: configs/model/dream_mappo_centralized.yaml (manifold + role-conditioned actor)

algo: dream_mappo
action_space: continuous

# Discounting and GAE.
gamma: 0.99
gae_lambda: 0.95

# PPO objective.
clip_ratio: 0.1
value_coef: 0.5
entropy_coef: 0.001

# Optimizer / minibatch settings.
lr: 3e-5
epochs: 2
minibatch_size: 2048
max_grad_norm: 0.5
target_kl: 0.02

use_centralized_critic: true
