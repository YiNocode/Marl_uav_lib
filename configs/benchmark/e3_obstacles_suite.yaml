# E3 obstacle-rich benchmark suite: ex2 obstacles + sharp-turn evader + random spawn.

suite: E3
scenario: e3_obstacles
backend: pyflyt
result_root: results/e3_obstacles_pyflyt
generated_config_dir: configs/generated/e3_obstacles

seeds: [101]
eval:
  base_seed: 8010
  episodes_per_seed: 200
  terminal_window: 30

speed:
  reference_world_xy: 2.0
  env_config: configs/env/e3_pyflyt_3v1_obstacles.yaml
  rl_defaults:
    continuous_action_xy_ref: 0.25
    continuous_action_yaw_ref: 0.01
    continuous_action_z_ref: 0.15

methods:
  sce:
    kind: heuristic
    config: configs/experiment/e3_obstacles_pyflyt_sce.yaml
    train: false
  pure_pursuit:
    kind: heuristic
    config: configs/experiment/e3_obstacles_pyflyt_pure_pursuit.yaml
    train: false
  oracle_slot:
    kind: heuristic
    config: configs/experiment/e3_obstacles_pyflyt_oracle_slot.yaml
    train: false
  hungarian_slot:
    kind: heuristic
    config: configs/experiment/e3_obstacles_pyflyt_hungarian_slot.yaml
    train: false
  ot_slot:
    kind: heuristic
    config: configs/experiment/e3_obstacles_pyflyt_ot_slot.yaml
    train: false
  sce_los_slot:
    kind: heuristic
    config: configs/experiment/e3_obstacles_pyflyt_sce_los_slot.yaml
    train: false
  sce_cached_path_slot:
    kind: heuristic
    config: configs/experiment/e3_obstacles_pyflyt_sce_cached_path_slot.yaml
    train: false
  sce_cached_path_cbf_slot:
    kind: heuristic
    config: configs/experiment/e3_obstacles_pyflyt_sce_cached_path_cbf_slot.yaml
    train: false
  fixed_ring:
    kind: heuristic
    config: configs/experiment/e3_obstacles_pyflyt_fixed_ring.yaml
    train: false
  mappo:
    kind: rl
    config: configs/experiment/pursuit_evasion_mappo_3v1_ex3.yaml
    train: true
    task_speed:
      pursuer_speed: 0.20
      evader_speed: 0.06
  dream_mappo_full:
    kind: rl
    config: configs/experiment/pursuit_evasion_dream_mappo_3v1_ex3.yaml
    train: true
    task_speed:
      pursuer_speed: 0.15
      evader_speed: 0.08
