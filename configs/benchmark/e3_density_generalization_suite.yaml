suite: E3
scenario: obstacle_density_generalization
backend: pyflyt
result_root: results/e3_density_generalization_pyflyt

eval_seeds: [301, 302, 303]
eval:
  base_seed: 9010
  episodes_per_seed: 200
  terminal_window: 30
  holdout_seeds: [301, 302, 303]

variants:
  - name: spacing_10m
    obstacle_grid_spacing: 10.0
    config_overrides:
      env: configs/env/pyflyt_density.yaml
  - name: spacing_8m
    obstacle_grid_spacing: 8.0
    config_overrides:
      env: configs/env/pyflyt_density.yaml
  - name: spacing_6m
    obstacle_grid_spacing: 6.0
    config_overrides:
      env: configs/env/pyflyt_density.yaml
  - name: spacing_5m
    obstacle_grid_spacing: 5.0
    config_overrides:
      env: configs/env/pyflyt_density.yaml

methods:
  pure_pursuit_apf:
    kind: heuristic
    config: configs/experiment/e2/pure_pursuit_apf.yaml
    paper_name: pure_pursuit_apf
    train: false
  fixed_ring_apf:
    kind: heuristic
    config: configs/experiment/e2/fixed_ring_apf.yaml
    paper_name: fixed_ring_apf
    train: false
  SCE:
    kind: heuristic
    config: configs/experiment/e2/sce.yaml
    paper_name: SCE
    train: false
