# E2 obstacle-rich benchmark suite (paper E2): PyFlyt 3v1 with cylindrical obstacles.
# Heuristic-only suite. E2 RL / BC / MAPPO configs are intentionally pruned.

suite: E2
scenario: e2_obstacles
backend: pyflyt
result_root: results/e2_obstacles_pyflyt

eval_seeds: [201, 202, 203]
eval:
  base_seed: 8010
  episodes_per_seed: 200
  terminal_window: 30
  holdout_seeds: [201, 202, 203]

methods:
  pure_pursuit:
    kind: heuristic
    config: configs/experiment/e2_obstacles_pyflyt_pure_pursuit.yaml
    train: false
  fixed_ring:
    kind: heuristic
    config: configs/experiment/e2_obstacles_pyflyt_fixed_ring.yaml
    train: false
  oracle_slot:
    kind: heuristic
    config: configs/experiment/e2_obstacles_pyflyt_oracle_slot.yaml
    train: false
  hungarian_slot:
    kind: heuristic
    config: configs/experiment/e2_obstacles_pyflyt_hungarian_slot.yaml
    train: false
  ot_slot:
    kind: heuristic
    config: configs/experiment/e2_obstacles_pyflyt_ot_slot.yaml
    train: false
  trajectory_planner:
    kind: heuristic
    config: configs/experiment/e2_obstacles_pyflyt_trajectory_planner.yaml
    train: false
