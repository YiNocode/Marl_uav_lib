# E1.1 main benchmark, open-space / obstacle-free, PyFlyt.
# Method: DREAM-MAPPO full method.

benchmark:
  suite: E1
  scenario: e1_1_open_space
  method: dream_mappo_full
  description: DREAM-MAPPO full method: MAPPO learner plus deformable manifold policy head, ex1 role assignment, and structure rewards.

env: configs/env/e1_1_pyflyt_3v1_open_space.yaml
algo: configs/algo/dream_mappo.yaml
model: configs/model/dream_mappo_centralized.yaml
train_results_dir: results/e1_1_open_space_pyflyt/training/dream_mappo_full

task:
  name: pursuit_evasion_3v1_ex1
  world_xy: 20.0
  z_min: 0.5
  z_max: 5.0
  capture_dist: 1.0
  episode_limit: 1000
  pursuer_speed: 0.15
  evader_speed: 0.20
  min_pursuer_sep: 0.6
  progress_reward_scale: 1.0
  min_progress_reward_scale: 0.5
  time_penalty: 0.05
  capture_bonus: 200.0
  collision_penalty: 2.0
  oob_penalty: 30.0
  evader_boundary_gain: 0.8
  mean_progress_reward_scale: 0.5
  capture_bonus_team: 30.0
  capture_bonus_individual: 10.0
  progress_dist_norm: 2.0
  continuous_action_xy_ref: 0.25
  continuous_action_yaw_ref: 0.01
  continuous_action_z_ref: 0.15

  role_features_enabled: true
  role_assignment_mode: nearest
  manifold_target_phase: 0.0
  manifold_target_radius_scale: 1.0
  assignment_inertia_margin: 0.05
  structure_reward_scale: 0.25
  structure_improve_scale: 0.2
  structure_hold_reward_scale: 0.05
  role_progress_reward_scale: 0.75
  radial_compress_reward_scale: 1.0
  radial_overshoot_penalty_scale: 0.5
  contraction_phase_structure_scale: 0.3
  contraction_phase_compress_scale: 2.0
  encirclement_capture_enabled: true
  encirclement_capture_hold_steps: 8
  encirclement_capture_max_gap_deg: 135.0
  encirclement_capture_radius_scale: 1.6
  encirclement_capture_min_dist_scale: 1.5
  encirclement_capture_radius_margin_scale: 0.35

  structure_cov_weight: 1.0
  structure_col_weight: 1.2
  structure_ang_weight: 1.0
  structure_cov_threshold: 0.75
  structure_col_threshold: 0.35
  structure_ang_threshold: 0.75
  structure_hold_steps_cap: 30
  manifold_contraction_rate: 0.01
  manifold_structure_gate_scale: 0.75

seed: 101
num_envs: 8
num_epochs: 10000
rollout_steps: 2048
log_interval: 1
eval_episodes: 20
