# Residual fine-tune variant: MAPPO backend after BC, relaxed capture guards.
# Requires bc_pretrained.pt from mappo_bc pretrain.
#
#   python scripts/benchmark_e1_1_open_space.py --mode train --methods mappo_bc_improve --overwrite-configs

benchmark:
  suite: E1
  scenario: e1_1_open_space
  method: mappo_bc_improve
  description: SCE ex1 stack — BC warm-start + MAPPO fine-tune with relaxed capture protection (execution backend tuning, not framework core).

env: configs/env/e1_1_pyflyt_3v1_open_space.yaml
algo: configs/algo/mappo_bc_improve.yaml
model: configs/model/centralized_critic.yaml
train_results_dir: results/e1_1_open_space_pyflyt/training/mappo_bc_improve

task:
  name: pursuit_evasion_3v1_ex1
  world_xy: 20.0
  z_min: 0.5
  z_max: 5.0
  capture_dist: 1.0
  episode_limit: 1000
  # pursuer_speed / evader_speed: see configs/benchmark/e1_1_open_space_suite.yaml → methods.mappo_bc_improve.task_speed
  min_pursuer_sep: 0.6
  progress_reward_scale: 1.0
  min_progress_reward_scale: 0.5
  time_penalty: 0.05
  collision_penalty: 2.0
  oob_penalty: 30.0
  evader_boundary_gain: 0.8
  mean_progress_reward_scale: 0.5
  capture_bonus_team: 200.0
  capture_bonus_individual: 50.0
  progress_dist_norm: 2.0
  structure_reward_scale: 0.0
  structure_improve_scale: 0.0
  structure_hold_reward_scale: 0.0
  role_progress_reward_scale: 0.0
  radial_compress_reward_scale: 0.0
  radial_overshoot_penalty_scale: 0.0
  encirclement_capture_enabled: true
  role_features_enabled: true
  debug: false

bc_warmstart:
  enabled: true
  expert: oracle_slot
  oracle_slot:
    xy_gain: 0.25
    z_gain: 0.20
  num_epochs: 100
  episodes_per_epoch: 48
  batch_size: 512
  lr: 0.0005
  max_grad_norm: 0.5
  mse_coef: 0.25
  log_interval: 5
  checkpoint_name: bc_pretrained.pt
  skip_if_exists: true
  load_for_mappo: true
  log_std_after_bc: -2.0
  eval_episodes: 20
  min_eval_capture_rate: 0.25

mappo_finetune:
  # Shorter critic warmup; then allow exploration + weaker BC anchor.
  protected_epochs: 600
  freeze_actor_epochs: 600
  deterministic_rollout_epochs: 1200
  entropy_coef_start: 0.0
  entropy_coef_end: 0.0005
  entropy_coef_ramp_epochs: 4000
  ppo_epochs_during_protection: 1
  actor_lr_scale_start: 0.15
  actor_lr_scale_end: 1.0
  actor_lr_ramp_epochs: 3000
  bc_kl_coef: 0.04
  bc_kl_coef_ramp_epochs: 0
  bc_kl_adaptive: true
  bc_kl_capture_baseline: 0.30
  bc_kl_regression_tolerance: 0.10
  bc_kl_regression_boost: 4.0
  bc_kl_relax_when_stable: 0.4
  bc_kl_coef_max: 0.25

seed: 102
num_envs: 1
num_epochs: 5000
rollout_steps: 1024
vec_rollout_steps_mode: total
log_interval: 1
eval_episodes: 20
