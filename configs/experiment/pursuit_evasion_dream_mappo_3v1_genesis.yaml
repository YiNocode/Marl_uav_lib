# Dream-MAPPO ex1 on Genesis 3v1 pursuit.
#
# Keep this file aligned with:
#   configs/experiment/pursuit_evasion_dream_mappo_3v1.yaml
# The only intentional difference is env -> configs/env/genesis_3v1.yaml.

env: configs/env/genesis_3v1.yaml
algo: configs/algo/dream_mappo.yaml
model: configs/model/dream_mappo_centralized.yaml

task:
  name: pursuit_evasion_3v1_ex1
  # Arena / episode settings. These mirror the PyFlyt ex1 config.
  world_xy: 20.0
  z_min: 0.5
  z_max: 5.0
  capture_dist: 1
  episode_limit: 1000
  # High-level velocity limits used by the pursuit task before backend control.
  pursuer_speed: 0.15
  evader_speed: 0.1
  min_pursuer_sep: 0.6
  # Base pursuit rewards.
  progress_reward_scale: 1.0
  min_progress_reward_scale: 0.5
  time_penalty: 0.05
  capture_bonus: 200.0
  collision_penalty: 2.0
  oob_penalty: 30.0
  evader_boundary_gain: 0.8
  mean_progress_reward_scale: 0.5
  capture_bonus_team: 30.0
  capture_bonus_individual: 10.0
  progress_dist_norm: 2.0

  # ex1 structure-aware pursuit rewards and hold criteria.
  structure_reward_scale: 0.25
  structure_improve_scale: 0.2
  structure_hold_reward_scale: 0.05
  structure_cov_weight: 1.0
  structure_col_weight: 1.2
  structure_ang_weight: 1.0
  structure_cov_threshold: 0.75
  structure_col_threshold: 0.35
  structure_ang_threshold: 0.75
  structure_hold_steps_cap: 30

seed: 205
num_envs: 8
num_epochs: 30000
rollout_steps: 1024
log_interval: 1
eval_episodes: 20
