# Dream-MAPPO ex2 on PyFlyt 3v1 pursuit with cylindrical obstacles.
#
# ex2 extends ex1 with obstacle-aware manifold terms and obstacle penalties.
# The Genesis counterpart is:
#   configs/experiment/pursuit_evasion_dream_mappo_3v1_ex2_genesis.yaml

env: configs/env/e2_pyflyt_3v1_obstacles.yaml
algo: configs/algo/dream_mappo.yaml
model: configs/model/dream_mappo_centralized.yaml

task:
  # High-level pursuit speeds and reward scales.
  pursuer_speed: 0.15
  evader_speed: 0.08
  min_pursuer_sep: 0.6
  progress_reward_scale: 1.0
  min_progress_reward_scale: 0.5
  time_penalty: 0.05
  capture_bonus: 200.0
  collision_penalty: 2.0
  oob_penalty: 30.0
  evader_boundary_gain: 0.8
  mean_progress_reward_scale: 0.5
  capture_bonus_team: 30.0
  capture_bonus_individual: 10.0
  progress_dist_norm: 2.0
  # ex1 structure-aware reward terms retained in ex2.
  structure_reward_scale: 0.22
  structure_improve_scale: 0.16
  structure_hold_reward_scale: 0.03
  structure_cov_weight: 1.0
  structure_col_weight: 1.2
  structure_ang_weight: 1.0
  structure_cov_threshold: 0.75
  structure_col_threshold: 0.35
  structure_ang_threshold: 0.75
  structure_hold_steps_cap: 30
  # ex2 manifold contraction / role-assignment shaping.
  radial_compress_reward_scale: 1.8
  radial_overshoot_penalty_scale: 0.28
  contraction_phase_structure_scale: 0.25
  contraction_phase_compress_scale: 2.1
  manifold_contraction_rate: 0.01
  manifold_structure_gate_scale: 0.72
  residual_control_gain: 0.5
  residual_control_gain_final: 0.2
  residual_control_gain_decay_epochs: 30000
  progress_gate_min_scale: 0.85
  role_progress_reward_scale: 0.95
  # Cylindrical obstacle manifold and collision settings.
  obstacle_manifold_top_k: 4
  obstacle_manifold_influence_radius_scale: 2.5
  obstacle_manifold_clearance_margin_scale: 0.35
  obstacle_manifold_fourier_scale: 0.45
  obstacle_manifold_fourier_order: 2
  obstacle_manifold_bump_sigma_deg: 24.0
  obstacle_manifold_bump_scale: 0.35
  obstacle_manifold_max_extra_radius_scale: 1.5
  manifold_curve_num_samples: 121

seed: 205
num_envs: 8
num_epochs: 3000
rollout_steps: 1024
log_interval: 1
eval_episodes: 20
