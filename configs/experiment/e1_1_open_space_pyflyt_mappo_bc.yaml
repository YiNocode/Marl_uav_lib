# E1.1 open-space: fixed_ring BC warm-start + MAPPO fine-tune.
#
# Training (via benchmark):
#   python scripts/benchmark_e1_1_open_space.py --mode train --methods mappo_bc --overwrite-configs
#
# BC only:
#   python scripts/benchmark_e1_1_open_space.py --mode pretrain --methods mappo_bc --overwrite-configs

benchmark:
  suite: E1
  scenario: e1_1_open_space
  method: mappo_bc
  description: MAPPO with fixed-ring behavior cloning warm-start, then on-policy fine-tuning.

env: configs/env/e1_1_pyflyt_3v1_open_space.yaml
algo: configs/algo/mappo.yaml
model: configs/model/centralized_critic.yaml
train_results_dir: results/e1_1_open_space_pyflyt/training/mappo_bc

# Match fixed_ring / pure_pursuit heuristic task (ex1 + encirclement capture).
task:
  name: pursuit_evasion_3v1_ex1
  world_xy: 20.0
  z_min: 0.5
  z_max: 5.0
  capture_dist: 1.0
  episode_limit: 1000
  pursuer_speed: 0.15
  evader_speed: 0.10
  min_pursuer_sep: 0.6
  progress_reward_scale: 1.0
  min_progress_reward_scale: 0.5
  time_penalty: 0.05
  collision_penalty: 2.0
  oob_penalty: 30.0
  evader_boundary_gain: 0.8
  mean_progress_reward_scale: 0.5
  capture_bonus_team: 200.0
  capture_bonus_individual: 50.0
  progress_dist_norm: 2.0
  continuous_action_xy_ref: 0.25
  continuous_action_yaw_ref: 0.01
  continuous_action_z_ref: 0.15
  structure_reward_scale: 0.0
  structure_improve_scale: 0.0
  structure_hold_reward_scale: 0.0
  role_progress_reward_scale: 0.0
  radial_compress_reward_scale: 0.0
  radial_overshoot_penalty_scale: 0.0
  encirclement_capture_enabled: true
  debug: false

bc_warmstart:
  enabled: true
  expert: fixed_ring
  fixed_ring:
    ring_radius: 1.6
    approach_gain: 0.25
    z_gain: 0.20
    phase: 0.0
    assignment: fixed
  num_epochs: 80
  episodes_per_epoch: 40
  batch_size: 512
  lr: 0.0003
  max_grad_norm: 0.5
  mse_coef: 0.1
  log_interval: 1
  checkpoint_name: bc_pretrained.pt
  skip_if_exists: true
  load_for_mappo: true

seed: 101
num_envs: 1
num_epochs: 3000
rollout_steps: 1024
vec_rollout_steps_mode: total
log_interval: 1
eval_episodes: 20
