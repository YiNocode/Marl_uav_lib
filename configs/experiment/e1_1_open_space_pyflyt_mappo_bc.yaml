# E1.1 open-space: residual skill-preserving fine-tune (BC warm-start + MAPPO backend).
# framework: structure_preserving_encirclement (partial — ex1 task + finetune guards)
# execution_backend: mappo
#
# Use oracle_slot (not fixed_ring) so expert targets match ex1 role/slot obs.
#
# Training:
#   python scripts/benchmark_e1_1_open_space.py --mode train --methods mappo_bc --overwrite-configs
#
# Re-run BC only (delete checkpoints/.../bc_pretrained.pt first):
#   python scripts/benchmark_e1_1_open_space.py --mode pretrain --methods mappo_bc --overwrite-configs

benchmark:
  suite: E1
  scenario: e1_1_open_space
  method: mappo_bc
  description: SCE-style ex1 stack with oracle-slot BC pretrain and capture-protected MAPPO fine-tuning (execution backend only).

env: configs/env/e1_1_pyflyt_3v1_open_space.yaml
algo: configs/algo/mappo_bc_finetune.yaml
model: configs/model/centralized_critic.yaml
train_results_dir: results/e1_1_open_space_pyflyt/training/mappo_bc

task:
  name: pursuit_evasion_3v1_ex1
  world_xy: 20.0
  z_min: 0.5
  z_max: 5.0
  capture_dist: 1.0
  episode_limit: 1000
  # pursuer_speed / evader_speed: see configs/benchmark/e1_1_open_space_suite.yaml → methods.mappo_bc.task_speed
  min_pursuer_sep: 0.6
  progress_reward_scale: 1.0
  min_progress_reward_scale: 0.5
  time_penalty: 0.05
  collision_penalty: 2.0
  oob_penalty: 30.0
  evader_boundary_gain: 0.8
  mean_progress_reward_scale: 0.5
  capture_bonus_team: 200.0
  capture_bonus_individual: 50.0
  progress_dist_norm: 2.0
  structure_reward_scale: 0.0
  structure_improve_scale: 0.0
  structure_hold_reward_scale: 0.0
  role_progress_reward_scale: 0.0
  radial_compress_reward_scale: 0.0
  radial_overshoot_penalty_scale: 0.0
  encirclement_capture_enabled: true
  role_features_enabled: true
  debug: false

bc_warmstart:
  enabled: true
  # Must match ex1 slot assignment in observations (fixed_ring does not).
  expert: oracle_slot
  oracle_slot:
    xy_gain: 0.25
    z_gain: 0.20
  num_epochs: 100
  episodes_per_epoch: 48
  batch_size: 512
  lr: 0.0005
  max_grad_norm: 0.5
  mse_coef: 0.25
  log_interval: 5
  checkpoint_name: bc_pretrained.pt
  skip_if_exists: True
  load_for_mappo: true
  log_std_after_bc: -2.0
  eval_episodes: 20
  min_eval_capture_rate: 0.25

mappo_finetune:
  # Unified guard: epoch < N keeps det rollout + zero entropy + frozen actor.
  # Your cliff ~1100 matched staggered ends (freeze 500 / det 800 / KL decay).
  protected_epochs: 1500
  deterministic_rollout_epochs: 2000
  entropy_coef_start: 0.0
  entropy_coef_end: 0.0
  entropy_coef_ramp_epochs: 3000
  freeze_actor_epochs: 1500
  ppo_epochs_during_protection: 1
  # After unfreeze: small actor steps + strong BC anchor (no KL decay).
  actor_lr_scale_start: 0.05
  actor_lr_scale_end: 1.0
  actor_lr_ramp_epochs: 2500
  bc_kl_coef: 0.15
  bc_kl_coef_ramp_epochs: 0
  # Hold capture when stable; relax KL slightly to allow improvement attempts.
  bc_kl_adaptive: true
  bc_kl_capture_baseline: auto
  bc_kl_regression_tolerance: 0.05
  bc_kl_regression_boost: 4.0
  bc_kl_relax_when_stable: 0.8
  bc_kl_coef_max: 0.8

seed: 101
num_envs: 1
num_epochs: 3000
rollout_steps: 1024
vec_rollout_steps_mode: total
log_interval: 1
eval_episodes: 20
