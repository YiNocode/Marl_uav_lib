# E1.1 main benchmark, open-space / obstacle-free, PyFlyt.
# Baseline: RL execution backend only (vanilla MAPPO), no SCE geometry/role/structure stack.

benchmark:
  suite: E1
  scenario: e1_1_open_space
  method: mappo
  description: Vanilla MAPPO execution backend on base 3v1 task; no deformable manifold, role assignment, or structure-aware guidance (necessary comparator, not the proposed framework).

env: configs/env/e1_1_pyflyt_3v1_open_space.yaml
algo: configs/algo/mappo.yaml
model: configs/model/centralized_critic.yaml
train_results_dir: results/e1_1_open_space_pyflyt/training/mappo

task:
  # Plain MAPPO baseline: base 3v1 task (27-dim obs), no ex1 structure/role features.
  name: pursuit_evasion_3v1
  world_xy: 20.0
  z_min: 0.5
  z_max: 5.0
  capture_dist: 1.0
  episode_limit: 1000
  # pursuer_speed / evader_speed: see configs/benchmark/e1_1_open_space_suite.yaml → methods.mappo.task_speed
  min_pursuer_sep: 0.6
  progress_reward_scale: 1.0
  min_progress_reward_scale: 0.5
  time_penalty: 0.05
  collision_penalty: 2.0
  oob_penalty: 30.0
  evader_boundary_gain: 0.8
  mean_progress_reward_scale: 0.5
  # compute_rewards uses capture_bonus_team / capture_bonus_individual (capture_bonus is legacy).
  capture_bonus_team: 200.0
  capture_bonus_individual: 50.0
  progress_dist_norm: 2.0
  debug: false

seed: 101
num_envs: 1
num_epochs: 3000
rollout_steps: 1024
vec_rollout_steps_mode: total
log_interval: 1
eval_episodes: 20
