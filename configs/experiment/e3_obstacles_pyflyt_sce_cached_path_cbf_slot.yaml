# E3 — deployable sce_cached_path_cbf_slot (cached path + lightweight CBF projection).

benchmark:
  suite: E3
  scenario: e3_obstacles
  method: sce_cached_path_cbf_slot
  description: Real-time SCE with cached path tracking and lightweight half-plane CBF on vx/vy.

env: configs/env/e3_pyflyt_3v1_obstacles_heuristic.yaml
train_results_dir: results/e3_obstacles_pyflyt/training/sce_cached_path_cbf_slot

task:
  name: pursuit_evasion_3v1_ex3
  evader_sharp_turn_enabled: False
  init_random_bias_enabled: true
  pursuer_speed: 0.25
  evader_speed: 0.25
  pursuer_vertical_speed: 0.30
  min_pursuer_sep: 0.6
  progress_reward_scale: 0.0
  min_progress_reward_scale: 0.0
  time_penalty: 0.0
  capture_bonus: 0.0
  collision_penalty: 0.0
  oob_penalty: 30.0
  evader_boundary_gain: 0.8
  mean_progress_reward_scale: 0.0
  capture_bonus_team: 0.0
  capture_bonus_individual: 0.0
  progress_dist_norm: 2.0
  continuous_action_xy_ref: 0.25
  continuous_action_yaw_ref: 0.25
  continuous_action_z_ref: 0.15
  structure_reward_scale: 0.0
  structure_improve_scale: 0.0
  structure_hold_reward_scale: 0.0
  role_progress_reward_scale: 0.0
  radial_compress_reward_scale: 0.0
  radial_overshoot_penalty_scale: 0.0
  encirclement_capture_enabled: true
  encirclement_capture_hold_steps: 8
  encirclement_capture_max_gap_deg: 135.0
  encirclement_capture_radius_scale: 1.6
  encirclement_capture_min_dist_scale: 1.5
  encirclement_capture_radius_margin_scale: 0.35
  role_features_enabled: false
  role_assignment_mode: entropic_ot
  ot_epsilon: 0.05
  ot_epsilon_scale: 0.25
  ot_sinkhorn_iterations: 25
  manifold_target_phase: 0.0
  manifold_target_radius_scale: 1.0
  manifold_contraction_rate: 0.01
  manifold_structure_gate_scale: 0.75
  assignment_inertia_margin: 0.05
  obstacle_manifold_top_k: 4
  obstacle_manifold_influence_radius_scale: 2.5
  obstacle_manifold_clearance_margin_scale: 0.35
  obstacle_manifold_fourier_scale: 0.45
  obstacle_manifold_fourier_order: 2
  obstacle_manifold_bump_sigma_deg: 24.0
  obstacle_manifold_bump_scale: 0.35
  obstacle_manifold_max_extra_radius_scale: 1.5
  manifold_curve_num_samples: 121

sce_cached_path_cbf_slot:
  xy_gain: 0.25
  z_gain: 0.20
  yaw_gain: 0.25
  yaw_align_min_speed: 0.25
  runtime_rates:
    control_hz: 50
    manifold_update_hz: 10
    assignment_update_hz: 5
    path_replan_hz: 1
    cbf_hz: 50
  reachability:
    enabled: true
    mode: structure_cached_path
    safety_margin: 0.3
    uav_radius: 0.15
    switch_penalty: 0.2
    structure_assignment:
      w_cov: 1.0
      w_col: 1.0
      w_ang: 1.0
      structure_scale: 10.0
      w_travel: 0.05
    pair_reachability:
      exclude_unreachable: true
    assignment:
      method: permute
    structure_slot_selection:
      enabled: true
      radius_scales: [1.0, 1.15, 1.3, 1.5, 1.75, 2.0]
      max_radius_scale: 2.0
    slot_projection:
      enabled: true
      replan_trigger_threshold: 0.05
      trigger_path_replan: true
    path_cache:
      enabled: true
      replan_interval: 10
      path_deviation_threshold: 0.25
      slot_replan_threshold: 0.3
      slot_replan_always: true
      slot_projection_force_replan: true
      max_replans_per_step: 3
      fallback_blocked_penalty: 50.0
      cache_validation_interval: 10
    obstacle_query:
      plan_mode: corridor
      validation_mode: full
      corridor_half_width: 2.5
    path_planner:
      build_static_graph_once: true
      num_obstacle_samples: 12
      planner_timeout_ms: 5.0
    path_tracking:
      lookahead_dist: 0.8
      waypoint_accept_radius: 0.2
      tube_radius: 0.35
      cross_track_gain: 1.0
      approach_dist: 0.5
      drift_replan_interval: 10
      boundary_margin: 0.30
      boundary_alpha: 2.0
      altitude_floor_margin: 0.25
      altitude_ceiling_margin: 0.10
  cbf:
    enabled: true
    solver: projection
    alpha_obstacle: 2.0
    alpha_agent: 2.0
    obstacle_activation_radius: 2.0
    agent_activation_radius: 1.5
    max_projection_iters: 5
    safety_margin: 0.3
    min_agent_sep: 0.6
    speed_clip: true
    infeasible_fallback: outward_velocity
    emergency_clearance: 0.05
    emergency_escape_speed: 0.25
    local_escape_enabled: true
    local_escape_extra_clearance: 0.15
    max_filter_time_ms: 2.0
    obstacle_query: radius_forward
    forward_range: 3.0
    forward_cone_half_deg: 90.0

seed: 101
eval_episodes: 200
