# E2 slot execution MAPPO: standalone learner + PyFlyt ex2 + debug browser.

benchmark:
  suite: E2
  scenario: e2_obstacles
  method: slot_exec_mappo
  description: Learned MAPPO execution to assigned manifold slots in obstacle field.

env: configs/env/e2_pyflyt_3v1_obstacles_heuristic.yaml
train_results_dir: results/e2_obstacles_pyflyt/training/slot_exec_mappo

method:
  name: slot_exec_mappo

slot_exec_mappo:
  checkpoint: results/e2_obstacles_pyflyt/training/slot_exec_mappo/policy.pt
  obs:
    obstacle_slots: 16
    include_prev_action: true
  reward:
    w_progress: 2.0
    w_alive: 0.01
    w_time: 0.02
    w_clearance: 0.15
    w_arrive: 5.0
    w_collision: 15.0
    w_oob: 10.0
    w_smooth: 0.05
    w_team_collision: 5.0
    progress_dist_norm: 2.0
    arrive_dist: 0.25
    clearance_margin: 0.30
  train:
    gamma: 0.99
    gae_lambda: 0.95
    clip_ratio: 0.2
    lr: 0.0003
    rollout_steps: 128
    ppo_epochs: 4
    hidden_sizes: [256, 256]

task:
  pursuer_speed: 0.25
  evader_speed: 0.25
  pursuer_vertical_speed: 0.30
  progress_reward_scale: 0.0
  min_progress_reward_scale: 0.0
  mean_progress_reward_scale: 0.0
  time_penalty: 0.0
  capture_bonus: 0.0
  collision_penalty: 0.0
  oob_penalty: 30.0
  structure_reward_scale: 0.0
  structure_improve_scale: 0.0
  structure_hold_reward_scale: 0.0
  role_progress_reward_scale: 0.0
  role_features_enabled: true
  role_assignment_mode: entropic_ot
  ot_epsilon: 0.05
  ot_epsilon_scale: 0.25
  ot_sinkhorn_iterations: 25
  assignment_inertia_margin: 0.05
  manifold_target_phase: 0.0
  manifold_target_radius_scale: 1.0
  manifold_contraction_rate: 0.01
  obstacle_manifold_top_k: 4
  obstacle_manifold_influence_radius_scale: 2.5
  obstacle_manifold_clearance_margin_scale: 0.35
  obstacle_manifold_fourier_scale: 0.45
  obstacle_manifold_fourier_order: 2
  obstacle_manifold_bump_sigma_deg: 24.0
  obstacle_manifold_bump_scale: 0.35
  obstacle_manifold_max_extra_radius_scale: 1.5
  manifold_curve_num_samples: 121
  debug_browser:
    enabled: true
    host: 127.0.0.1
    port: 8765
    open_browser: true
    playback_speed: 1.0

seed: 101
eval_episodes: 50
