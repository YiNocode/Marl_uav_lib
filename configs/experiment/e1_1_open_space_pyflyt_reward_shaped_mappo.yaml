# E1.1 ablation: MAPPO backend + structure rewards only (no deformable manifold policy head).
# Compares against full SCE instance (dream_mappo_full).

benchmark:
  suite: E1
  scenario: e1_1_open_space
  method: reward_shaped_mappo
  description: Vanilla MAPPO backend with ex1 structure observations and reward shaping; no closed-curve manifold policy head (E5 ablation comparator).

env: configs/env/e1_1_pyflyt_3v1_open_space.yaml
algo: configs/algo/mappo.yaml
model: configs/model/centralized_critic.yaml
train_results_dir: results/e1_1_open_space_pyflyt/training/reward_shaped_mappo

task:
  name: pursuit_evasion_3v1_ex1
  world_xy: 20.0
  z_min: 0.5
  z_max: 5.0
  capture_dist: 1.0
  episode_limit: 1000
  # pursuer_speed / evader_speed: see configs/benchmark/e1_1_open_space_suite.yaml → methods.reward_shaped_mappo.task_speed
  min_pursuer_sep: 0.6
  progress_reward_scale: 1.0
  min_progress_reward_scale: 0.5
  time_penalty: 0.05
  capture_bonus: 200.0
  collision_penalty: 2.0
  oob_penalty: 30.0
  evader_boundary_gain: 0.8
  mean_progress_reward_scale: 0.5
  capture_bonus_team: 30.0
  capture_bonus_individual: 10.0
  progress_dist_norm: 2.0

  role_features_enabled: false
  structure_reward_scale: 0.25
  structure_improve_scale: 0.2
  structure_hold_reward_scale: 0.05
  role_progress_reward_scale: 0.0
  radial_compress_reward_scale: 1.0
  radial_overshoot_penalty_scale: 0.5
  contraction_phase_structure_scale: 0.3
  contraction_phase_compress_scale: 2.0
  encirclement_capture_enabled: false

  structure_cov_weight: 1.0
  structure_col_weight: 1.2
  structure_ang_weight: 1.0
  structure_cov_threshold: 0.75
  structure_col_threshold: 0.35
  structure_ang_threshold: 0.75
  structure_hold_steps_cap: 30
  manifold_contraction_rate: 0.01
  manifold_structure_gate_scale: 0.75

seed: 101
num_envs: 8
num_epochs: 3000
rollout_steps: 1024
vec_rollout_steps_mode: total
log_interval: 1
eval_episodes: 20
