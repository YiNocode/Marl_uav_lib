# Shared runtime rates for deployable SCE baselines (50 Hz control).
_runtime_rates: &runtime_rates
  control_hz: 50
  manifold_update_hz: 10
  assignment_update_hz: 5
  path_replan_hz: 1
  cbf_hz: 50

_path_cache: &path_cache
  enabled: true
  pair_cost_mode: los_penalty_cached
  replan_interval: 10
  path_deviation_threshold: 0.5
  slot_replan_threshold: 0.5
  goal_rounding_resolution: 0.5
  start_rounding_resolution: 0.5
  max_replans_per_step: 3
  fallback_blocked_penalty: 50.0

_path_planner: &path_planner
  build_static_graph_once: true
  type: visibility_graph
  num_obstacle_samples: 12
  clearance: 0.2
  max_nodes: 128
  shortcut_smoothing: true
  planner_timeout_ms: 5.0
  local_margin: 6.0
