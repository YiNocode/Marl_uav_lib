env: configs/env/e2_pyflyt_3v1_obstacles.yaml
algo: configs/algo/mappo.yaml
model: configs/model/centralized_critic.yaml
task:
  pursuer_speed: 0.2
  evader_speed: 0.06
  min_pursuer_sep: 0.6
  progress_reward_scale: 2.0
  min_progress_reward_scale: 1.0
  time_penalty: 0.001
  capture_bonus: 200.0
  collision_penalty: 2.0
  oob_penalty: 30.0
  evader_boundary_gain: 0.8
  mean_progress_reward_scale: 2.0
  capture_bonus_team: 30.0
  capture_bonus_individual: 10.0
  progress_dist_norm: 2.0
  structure_reward_scale: 0.22
  structure_improve_scale: 0.15
  structure_hold_reward_scale: 0.03
  structure_cov_weight: 1.0
  structure_col_weight: 1.2
  structure_ang_weight: 1.0
  structure_cov_threshold: 0.75
  structure_col_threshold: 0.35
  structure_ang_threshold: 0.75
  structure_hold_steps_cap: 30
  radial_compress_reward_scale: 1.6
  radial_overshoot_penalty_scale: 0.25
  contraction_phase_structure_scale: 0.25
  contraction_phase_compress_scale: 2.0
  manifold_contraction_rate: 0.01
  manifold_structure_gate_scale: 0.7
  residual_control_gain: 0.5
  residual_control_gain_final: 0.2
  residual_control_gain_decay_epochs: 30000
  progress_gate_min_scale: 0.85
  role_progress_reward_scale: 0.9
  obstacle_manifold_top_k: 4
  obstacle_manifold_influence_radius_scale: 2.5
  obstacle_manifold_clearance_margin_scale: 0.35
  obstacle_manifold_fourier_scale: 0.45
  obstacle_manifold_fourier_order: 2
  obstacle_manifold_bump_sigma_deg: 24.0
  obstacle_manifold_bump_scale: 0.35
  obstacle_manifold_max_extra_radius_scale: 1.5
  manifold_curve_num_samples: 121
  continuous_action_xy_ref: 0.25
  continuous_action_yaw_ref: 0.01
  continuous_action_z_ref: 0.15
seed: 101
num_envs: 8
num_epochs: 30000
rollout_steps: 2048
log_interval: 1
eval_episodes: 20
vec_env_context: spawn
vec_env_shared_memory: true
vec_env_copy: false
train_results_dir: .
