benchmark:
  suite: E1
  scenario: e1_1_open_space
  method: mappo
  description: Pure MAPPO on the base pursuit task; no structure observation, no structure
    reward shaping, no DREAM manifold policy.
env: configs/env/e1_1_pyflyt_3v1_open_space.yaml
algo: configs/algo/mappo.yaml
model: configs/model/centralized_critic.yaml
train_results_dir: results/e1_1_open_space_pyflyt/training/mappo
task:
  name: pursuit_evasion_3v1
  world_xy: 20.0
  z_min: 0.5
  z_max: 5.0
  capture_dist: 1.0
  episode_limit: 1000
  pursuer_speed: 0.15
  evader_speed: 0.2
  min_pursuer_sep: 0.6
  progress_reward_scale: 1.0
  min_progress_reward_scale: 0.5
  time_penalty: 0.05
  capture_bonus: 200.0
  collision_penalty: 2.0
  oob_penalty: 30.0
  evader_boundary_gain: 0.8
  mean_progress_reward_scale: 0.5
  capture_bonus_team: 30.0
  capture_bonus_individual: 10.0
  progress_dist_norm: 2.0
  continuous_action_xy_ref: 0.25
  continuous_action_yaw_ref: 0.01
  continuous_action_z_ref: 0.15
seed: 102
num_envs: 8
num_epochs: 3000
rollout_steps: 1024
vec_rollout_steps_mode: total
log_interval: 1
eval_episodes: 20
