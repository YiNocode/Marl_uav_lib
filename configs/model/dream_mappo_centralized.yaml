# SCE framework policy head (legacy type name: dream_mappo_centralized_critic).
#
# Actor: local obs + role-conditioned manifold residuals.
# Critic: global pursuit state. Training uses standard MAPPO backend (dream_mappo.yaml).

type: dream_mappo_centralized_critic

actor:
  encoder_type: mlp
  hidden_dims: [64, 64]
  activation: relu

critic:
  encoder_type: mlp
  hidden_dims: [128, 128]
  activation: relu

share_backbone: false

dream:
  num_pursuers: 3
  # Residual action head: a_res = a_max_residual * tanh(z).
  a_max_residual: 0.08
  # Geometry head scales used by marl_uav.policies.dream_mappo_policy.
  a_max_geom: 0.15
  sigma_p: 0.5
  rho_scale: 0.5
  rho_min: 0.05
  psi_scale: 3.14159265
