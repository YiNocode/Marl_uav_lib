benchmark:
  name: slot_tracking_stress
  num_seeds: 50
  seeds_start: 2001
  scenario_groups: [B, C, D, E, F]
  speed_levels: [0.8, 1.0, 1.2, 1.5]
  max_cases_per_group: null

world:
  world_xy: 20.0
  z: 1.0
  boundary_margin: 0.0

dynamics:
  dt: 0.05
  episode_steps: 1200
  uav_vmax: 1.0
  uav_amax: 1.5
  uav_radius: 0.15
  nominal_controller_vmax: 1.0
  slot_tolerance: 0.6
  lost_threshold: 1.5
  safety_margin: 0.30
  inter_agent_min_distance: 0.50

success:
  final_error_threshold: 0.65
  steady_state_error_threshold: 0.85
  max_lost_ratio: 0.30
  lock_threshold: 0.65
  lock_window: 50
  reacquisition_threshold: 0.9
  reacquisition_max_steps: 160
  realtime_p95_ms: 10.0

failure_classifier:
  near_boundary_distance: 1.2
  outward_velocity_ratio_threshold: 0.30
  stuck_progress_threshold: 0.15
  stuck_clearance_threshold: 0.40
  no_progress_window_fraction: 0.4
  oscillation_error_threshold: 0.8
  oscillation_std_threshold: 0.45
  severe_lost_threshold: 3.0
  severe_lost_min_ratio: 0.20
  infeasible_outside_ratio: 0.30
  infeasible_speed_tolerance: 1.05
  slot_out_of_bounds_threshold: 0.30
  slot_boundary_safety_margin: 0.30
  slot_too_close_ratio_threshold: 0.45
  slot_unreachable_ratio_threshold: 0.45
  static_slot_speed_epsilon: 1.0e-6

robustness:
  observation_noise_std: [0.10, 0.20]
  obstacle_noise_std: [0.05, 0.10]
  action_delay_steps: [1, 3, 5]
  actual_vmax_scale: [0.8, 0.6]
  wind_std: [0.05, 0.10]
  obstacle_dropout_prob: [0.25, 0.50]

controllers:
  pure_pursuit:
    kp: 1.4
    arrival_radius: 0.05
  pd:
    kp: 1.6
    kd: 0.45
    slot_velocity_gain: 0.6
  apf:
    kp: 1.2
    kd: 0.25
    obstacle_gain: 1.0
    boundary_gain: 2.0
    influence_radius: 2.8
  nominal_slot_tracker:
    kp: 1.6
    kd: 0.45
    vmax: 1.0
    amax: 1.5
    dt: 0.05
  existing:
    free_space_fallback: true
    obstacle_activation_distance: 2.2
    boundary_activation_distance: 2.2
    boundary_hard_margin: 0.30
    boundary_braking_gain: 1.2
    boundary_projection_enabled: true
    max_inward_correction: 1.0
    inter_agent_activation_distance: 0.85
    line_of_sight_shortcut: true
    line_of_sight_safety_margin: 0.30
    nominal_slot_tracker:
      kp: 1.6
      kd: 0.45
      vmax: 1.0
      amax: 1.5
      dt: 0.05
    horizon_s: 1.5
    dt: 0.05
    vmax: 1.0
    amax_xy: 1.5
    uav_radius: 0.15
    safety_margin: 0.30
    boundary_margin: 0.0
    position_kp: 1.2
    obstacle_influence_radius: 2.8
    obstacle_barrier_gain: 1.8
    obstacle_repulse_gain: 0.35
    prefer_holonomic_tracking: true
    use_sampled_planner: false

output:
  save_raw_trajectories: true
  save_plots_for_first_n_per_group: 5
